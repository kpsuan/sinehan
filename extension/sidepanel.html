<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sinehan</title>
  <style>
    @font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root {
      --bg: #16111c;
      --raised: #1f1827;
      --line: #2c2337;
      --text: #ece6f3;
      --muted: #978ca6;
      --accent: #c9b6f2;
      --accent-ink: #1b1325;
      --them: #251d2e;
      --live: #9fd6b0;
      --danger: #e5868f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.4 'Inter', system-ui, sans-serif; }
    [hidden] { display: none !important; }

    button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--raised); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    button.primary:hover:not(:disabled) { background: #d8c9f7; }
    input { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: inherit; font: inherit; outline: none; }
    input::placeholder { color: #6f6580; }
    select { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: inherit; font: inherit; outline: none; }
    select:focus { border-color: var(--accent); }
    #devicePerm { margin-top: 10px; width: 100%; font-size: 12px; }
    input:focus { border-color: var(--accent); }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

    .avatar { flex: none; display: inline-block; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--bg); }
    .avatar img { width: 100%; height: 100%; display: block; }

    /* Header */
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    #who { display: flex; }
    #who .avatar + .avatar { margin-left: -8px; }
    .meta { flex: 1; min-width: 0; }
    #names { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    #status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5a5066; }
    #status[data-state='waiting']::before { background: #d9c27a; }
    #status[data-state='live']::before { background: var(--live); }
    #invite { position: relative; color: var(--muted); }
    #invite:hover { color: var(--text); }
    #invite .i-check { display: none; }
    #invite.copied { color: var(--live); border-color: var(--live); }
    #invite.copied .i-link { display: none; }
    #invite.copied .i-check { display: block; }
    #invite.copied::after { content: 'Copied'; position: absolute; top: calc(100% + 6px); right: 0; padding: 3px 7px; border-radius: 4px;
      background: var(--raised); border: 1px solid var(--line); color: var(--text); font-size: 11px; white-space: nowrap; z-index: 2; }
    #inviteBox { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    #inviteBox input { font-size: 12px; color: var(--accent); }

    /* What we're watching + together actions */
    #watchBar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
    #watchIcon { width: 16px; height: 16px; border-radius: 3px; flex: none; }
    .wb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .wb-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    #watchTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #watchTitle.none { color: var(--muted); }
    #watchHere { font-size: 12px; padding: 5px 8px; flex: none; }
    #handBtn, #countdownBtn { flex: none; font-size: 12px; padding: 5px 7px; }
    #countdownBtn { font-weight: 600; letter-spacing: .02em; }
    #handBtn.sent { animation: pulse .6s ease-out; }
    #followBar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line);
      background: var(--raised); border-left: 3px solid var(--accent); }
    #followText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #followBar button { flex: none; padding: 5px 10px; font-size: 12px; }
    #followClose { border: 0; color: var(--muted); }
    /* Their hand-hold: the header glows for a moment */
    .top.holding { animation: glow 2.6s ease-in-out; }
    @keyframes glow { 0%, 100% { box-shadow: none; } 25%, 70% { box-shadow: inset 0 0 40px rgba(201, 182, 242, .45); } }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* Settings */
    /* Opened from the gear icon in the header */
    #settings[open] { border-bottom: 1px solid var(--line); background: var(--raised); }
    #settings .body { padding: 14px; }
    #settingsBtn { color: var(--muted); }
    #settingsBtn:hover, #settingsBtn[aria-pressed='true'] { color: var(--text); }
    #settingsBtn[aria-pressed='true'] { border-color: var(--accent); }
    .group + .group { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .group h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .field { display: block; color: var(--muted); font-size: 12px; }
    .field + .field { margin-top: 10px; }
    .field input { margin-top: 4px; }
    .profile { display: flex; align-items: flex-end; gap: 12px; }
    .profile .field { flex: 1; min-width: 0; }
    #myAvatar .avatar { box-shadow: none; }
    #avatars { display: flex; gap: 14px; margin-top: 14px; padding: 2px; }
    #avatars button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; display: block; }
    #avatars button .avatar { width: 100% !important; height: 100% !important; box-shadow: none; transition: transform .12s; }
    #avatars button:hover:not(:disabled) { background: none; }
    #avatars button:hover .avatar { transform: scale(1.06); }
    #avatars button.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
    #avatars button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    .row button { flex: 1; }

    /* Video call */
    .stage { position: relative; aspect-ratio: 4 / 3; background: #0d0a11; }
    #remote { width: 100%; height: 100%; object-fit: cover; display: block; }
    #local { position: absolute; right: 10px; bottom: 10px; width: 28%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px;
      transform: scaleX(-1); background: var(--raised); box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
    #remoteMic { position: absolute; left: 10px; top: 10px; padding: 3px 8px; border-radius: 4px; font-size: 12px;
      background: rgba(13, 10, 17, .75); color: var(--text); }
    #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; color: var(--muted); }
    #faces { display: flex; }
    #faces .avatar + .avatar { margin-left: -14px; }
    .controls { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .controls .wide { flex: 1; }
    .icon { padding: 7px; }
    .icon.off { color: var(--danger); border-color: #4a2a33; }
    #hangup { margin-left: auto; color: var(--danger); border-color: #4a2a33; }

    /* Chat */
    .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #log:empty::before { content: 'No messages yet.'; color: #6f6580; }
    .line { display: flex; align-items: flex-end; gap: 6px; }
    .line.me { flex-direction: row-reverse; }
    .msg { max-width: 80%; padding: 6px 10px; border-radius: 12px 12px 12px 3px; background: var(--them); overflow-wrap: anywhere; }
    .line.me .msg { border-radius: 12px 12px 3px 12px; background: var(--accent); color: var(--accent-ink); }
    .line.me .who { display: none; }
    .line.system { justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 0; }
    .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 1px; }
    .msg.big { background: none !important; padding: 0 2px; font-size: 30px; line-height: 1.15; }
    .line.me .msg.big .who { display: none; }
    .stamp { display: inline-block; margin-top: 3px; padding: 0 5px; border: 0; border-radius: 4px; font-size: 10px; font-variant-numeric: tabular-nums;
      background: rgba(0, 0, 0, .18); color: inherit; opacity: .7; cursor: pointer; }
    .stamp:hover { opacity: 1; background: rgba(0, 0, 0, .3); }
    .msg.big .stamp { font-size: 10px; vertical-align: middle; margin-left: 4px; }
    #typing { padding: 0 14px 6px; color: var(--muted); font-size: 12px; font-style: italic; }
    #form { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
    #form button { padding: 7px 9px; }
    #form .icon { color: var(--muted); }
    #form .icon[aria-pressed='true'] { color: var(--accent); border-color: var(--accent); }

    /* Emoji tray (opens above the message box) */
    .tray { border-top: 1px solid var(--line); background: var(--raised); max-height: 280px; overflow-y: auto; padding: 10px 14px;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tray-label { color: var(--muted); font-size: 11px; font-weight: 500; margin: 8px 0 4px; }
    .tray-label:first-child { margin-top: 0; }
    .quick, .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); }
    .quick button, .emoji-grid button { border: 0; padding: 4px 0; font-size: 20px; line-height: 1.2; border-radius: 6px; }
    .quick button:hover, .emoji-grid button:hover { background: var(--line); }
  </style>
</head>
<body>
  <header class="top">
    <div id="who"></div>
    <div class="meta">
      <div id="names">Sinehan</div>
      <div id="status">Not connected</div>
    </div>
    <button id="invite" class="icon" title="Copy invite link" aria-label="Copy invite link">
      <svg class="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L11.6 6" /><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6" /></svg>
      <svg class="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    </button>
    <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings" aria-pressed="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
    </button>
  </header>
  <div id="inviteBox" hidden><input id="inviteLink" readonly /></div>

  <div id="watchBar">
    <img id="watchIcon" alt="" hidden />
    <div class="wb-text">
      <span class="wb-label">Watching</span>
      <span id="watchTitle">Nothing yet</span>
    </div>
    <button id="watchHere" hidden title="Make the tab you're on the show you're watching together">Watch here</button>
    <button id="handBtn" class="icon" title="Hold their hand">🤝</button>
    <button id="countdownBtn" class="icon" title="Count down 3-2-1 and play together">3·2·1</button>
  </div>
  <div id="followBar" hidden>
    <span id="followText"></span>
    <button id="followGo" class="primary">Go</button>
    <button id="followClose" class="icon" title="Dismiss">✕</button>
  </div>

  <details id="settings" open>
    <summary hidden>Settings</summary>
    <div class="body">
      <section class="group">
        <h2>Profile</h2>
        <div class="profile">
          <div id="myAvatar"></div>
          <label class="field">Name <input id="name" maxlength="30" placeholder="Shown in chat" /></label>
        </div>
        <div id="avatars" role="radiogroup" aria-label="Picture"></div>
      </section>
      <section class="group">
        <h2>Camera & mic</h2>
        <label class="field">Camera <select id="camSelect"></select></label>
        <label class="field">Microphone <select id="micSelect"></select></label>
        <button id="devicePerm" hidden>Allow access to see your devices</button>
      </section>
      <section class="group">
        <h2>Connection</h2>
        <label class="field">Server <input id="server" placeholder="wss://your-relay.onrender.com" /></label>
        <label class="field">Room <input id="room" placeholder="Leave empty and Invite makes one" /></label>
        <div class="row">
          <button id="connect" class="primary">Connect</button>
          <button id="disconnect">Leave</button>
        </div>
      </section>
    </div>
  </details>

  <div class="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted hidden></video>
    <div id="remoteMic" hidden title="Their microphone is off">🔇 Mic off</div>
    <div id="placeholder"><div id="faces"></div><div id="phText"></div></div>
  </div>
  <div class="controls">
    <button id="start" class="primary wide">Start video call</button>
    <button id="join" class="primary wide" hidden>Join with camera</button>
    <button id="mic" class="icon" hidden title="Mute / unmute">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
    </button>
    <button id="cam" class="icon" hidden title="Camera on / off">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2" /><path d="M15 10.5l6-3.5v10l-6-3.5" /></svg>
    </button>
    <button id="pip" class="icon" hidden title="Pop out (use before going fullscreen)">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><rect x="12" y="11" width="6" height="5" rx="1" /></svg>
    </button>
    <button id="hangup" hidden>Hang up</button>
  </div>

  <section class="chat">
    <div id="log"></div>
    <div id="emojiTray" class="tray" hidden>
      <div class="tray-label">Quick react: sends right away and floats on their screen</div>
      <div id="quick" class="quick"></div>
      <div id="emojiGrid"></div>
    </div>
    <div id="typing" hidden></div>
    <form id="form">
      <button type="button" id="emojiBtn" class="icon" title="Emoji" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01" /></svg>
      </button>
      <input id="msg" maxlength="500" placeholder="Message" autocomplete="off" />
      <button class="primary" title="Send">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </button>
    </form>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
