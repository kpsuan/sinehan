<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sinehan</title>
  <style>
    @font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root {
      --bg: #0c0a10;
      --card: rgba(18, 14, 24, .55);
      --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 8px 24px rgba(0, 0, 0, .25);
      --card-blur: blur(16px);
      --btn: rgba(255, 255, 255, .05);
      --menu: #1d1825;
      --soft: rgba(255, 255, 255, .03);
      --ring: #15111b;
      --body-bg: radial-gradient(140% 60% at 50% -12%, #241c31 0%, #14101a 45%, #0c0a10 75%);
      --card-edge: rgba(255, 255, 255, .075);
      --field: rgba(255, 255, 255, .045);
      --hover: rgba(255, 255, 255, .08);
      --line: rgba(255, 255, 255, .07);
      --text: #efeaf6;
      --muted: #9a90aa;
      --faint: #6d6479;
      --accent: #c9b6f2;
      --accent-ink: #1b1325;
      --accent-glow: rgba(201, 182, 242, .28);
      --them: rgba(255, 255, 255, .07);
      --live: #9fd6b0;
      --danger: #e5868f;
    }
    /* Dark: solid surfaces, nothing shows through. */
    :root[data-theme='dark'] {
      --card: #16121c;
      --card-blur: none;
      --card-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset;
      --body-bg: #0c0a10;
    }
    /* Light: white surfaces, deeper purple accent for contrast. */
    /* Light: clean and neutral. Off-white page, white panels, true greys, one vivid accent; no glass, no outlines. */
    :root[data-theme='light'] {
      --bg: #f4f4f5;
      --body-bg: #f4f4f5;
      --card: #ffffff;
      --card-edge: transparent;
      --card-shadow: 0 1px 2px rgba(16, 16, 24, .04), 0 6px 20px rgba(16, 16, 24, .04);
      --card-blur: none;
      --field: #f4f4f5;
      --hover: #ececee;
      --line: transparent;
      --btn: #f4f4f5;
      --menu: #ffffff;
      --soft: #f7f7f8;
      --ring: #ffffff;
      --text: #111114;
      --muted: #85858f;
      --faint: #b2b2ba;
      --accent: #6c4ef5;
      --accent-ink: #ffffff;
      --accent-glow: rgba(108, 78, 245, .22);
      --them: #f2f2f4;
      --live: #22a55a;
      --danger: #e5484d;
    }
    :root[data-theme='light'] select option { background: #fff; }
    :root[data-theme='light'] button.primary:hover:not(:disabled) { background: #5b3ef0; }
    :root[data-theme='light'] button.primary { box-shadow: 0 4px 14px var(--accent-glow); }
    :root[data-theme='light'] .stamp { background: rgba(16, 16, 24, .06); }
    :root[data-theme='light'] .line.me .stamp { background: rgba(255, 255, 255, .22); }
    :root[data-theme='light'] input:focus, :root[data-theme='light'] select:focus { border-color: transparent; background: #fff; box-shadow: 0 0 0 2px var(--accent); }
    :root[data-theme='light'] .top .icon[aria-pressed='true'] { background: #ede9fe; color: var(--accent); }
    :root[data-theme='light'] #avatars button.selected { outline-color: var(--accent); box-shadow: none; }
    :root[data-theme='light'] .icon.off { background: #fdecec; }
    :root[data-theme='light'] .group + .group { border-top: 0; padding-top: 4px; }
    :root[data-theme='light'] #form { border-top: 0; }
    :root[data-theme='light'] .stage { background: #f4f4f5; border-color: transparent; }
    :root[data-theme='light'] #placeholder { color: var(--muted); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; gap: 8px; padding: 8px; color: var(--text); font: 13px/1.4 'Inter', system-ui, sans-serif;
      background: var(--body-bg); }
    [hidden] { display: none !important; }

    /* Behind the glass: a blurred, dimmed snapshot of the show (set by sidepanel.js), so the cards are see-through. */
    #backdrop { position: fixed; inset: -60px; z-index: -1; background: center / cover no-repeat; opacity: 0;
      filter: blur(40px) saturate(1.2) brightness(.38); transition: opacity 1.2s ease, background-image .8s ease; pointer-events: none; }
    #backdrop.on { opacity: 1; }
    :root[data-theme='dark'] #backdrop, :root[data-theme='light'] #backdrop { display: none; }

    /* Appearance picker */
    .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .themes button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; font-size: 12px; }
    .themes button[aria-pressed='true'] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .swatch { width: 100%; height: 34px; border-radius: 5px; border: 1px solid var(--line); }
    .swatch.glass { background: linear-gradient(135deg, rgba(60, 120, 200, .55), rgba(220, 110, 70, .45)), #1a1522; }
    .swatch.dark { background: #16121c; }
    .swatch.light { background: #fff; box-shadow: inset 0 0 0 9px #f4f4f5; }

    /* Smoky glass cards */
    .card { flex: none; border-radius: 10px; background: var(--card); border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur); }

    button { font: inherit; color: inherit; background: var(--btn); border: 1px solid var(--line); border-radius: 7px;
      padding: 7px 11px; cursor: pointer; transition: background .15s, box-shadow .15s, transform .1s; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: default; }
    button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: 0 6px 20px var(--accent-glow); }
    button.primary:hover:not(:disabled) { background: #d8c9f7; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--field); color: inherit; font: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s; }
    select option { background: #17131d; }
    input::placeholder { color: var(--faint); }
    input:focus, select:focus { border-color: rgba(201, 182, 242, .55); box-shadow: 0 0 0 3px rgba(201, 182, 242, .12); }
    #devicePerm { margin-top: 10px; width: 100%; font-size: 12px; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .icon { padding: 7px; }
    .icon.off { color: var(--danger); border-color: rgba(229, 134, 143, .35); background: rgba(229, 134, 143, .08); }
    h2 { margin: 0 0 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    .avatar { flex: none; display: inline-block; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--ring); }
    .avatar img { width: 100%; height: 100%; display: block; }

    /* Header */
    .top { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; }
    #who { display: flex; }
    #who .avatar + .avatar { margin-left: -8px; }
    .meta { flex: 1; min-width: 0; }
    #names { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    #status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5a5066; }
    #status[data-state='waiting']::before { background: #d9c27a; box-shadow: 0 0 6px rgba(217, 194, 122, .6); }
    #status[data-state='live']::before { background: var(--live); box-shadow: 0 0 6px rgba(159, 214, 176, .7); }
    .top .icon { color: var(--muted); }
    .top .icon:hover, .top .icon[aria-pressed='true'] { color: var(--text); }
    .top .icon[aria-pressed='true'] { border-color: rgba(201, 182, 242, .45); background: rgba(201, 182, 242, .1); }
    #invite { position: relative; }
    #invite .i-check { display: none; }
    #invite.copied { color: var(--live); border-color: rgba(159, 214, 176, .5); }
    #invite.copied .i-link { display: none; }
    #invite.copied .i-check { display: block; }
    #invite.copied::after { content: 'Copied'; position: absolute; top: calc(100% + 6px); right: 0; padding: 3px 8px; border-radius: 6px;
      background: var(--menu); border: 1px solid var(--card-edge); color: var(--text); font-size: 11px; white-space: nowrap; z-index: 2; }
    #inviteBox { padding: 8px; }
    #inviteBox input { font-size: 12px; color: var(--accent); }
    /* Their hand-hold: the header glows for a moment */
    .top.holding { animation: glow 2.6s ease-in-out; }
    @keyframes glow { 0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); } 25%, 70% { box-shadow: inset 0 0 40px rgba(201, 182, 242, .4), 0 0 24px rgba(201, 182, 242, .25); } }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* What we're watching + together actions */
    #watchBar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; }
    #watchIcon { width: 16px; height: 16px; border-radius: 4px; flex: none; }
    .wb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .wb-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    #watchTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #watchTitle.none { color: var(--muted); }
    #watchHere { font-size: 12px; padding: 5px 9px; flex: none; }
    #handBtn, #countdownBtn { flex: none; font-size: 12px; padding: 5px 8px; }
    #countdownBtn { font-weight: 600; letter-spacing: .02em; }
    #handBtn.sent { animation: pulse .6s ease-out; }
    #followBar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-color: rgba(201, 182, 242, .3); }
    #followText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #followBar button { flex: none; padding: 5px 11px; font-size: 12px; }
    #followClose { border: 0; background: none; color: var(--muted); }

    /* Settings (opened from the gear) */
    #settings:not([open]) { display: none; }
    /* While settings are open they get the whole sidebar (call and chat come back when closed). */
    #settings[open] { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    body:has(#settings[open]) .call, body:has(#settings[open]) .chat { display: none; }
    #settings .body { padding: 14px 12px; }
    .group + .group { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .field { display: block; color: var(--muted); font-size: 12px; }
    .field + .field { margin-top: 10px; }
    .field input, .field select { margin-top: 4px; }
    .profile { display: flex; align-items: flex-end; gap: 12px; }
    .profile .field { flex: 1; min-width: 0; }
    #myAvatar .avatar { box-shadow: 0 0 0 1px var(--card-edge); }
    #avatars { display: flex; gap: 14px; margin-top: 14px; padding: 2px; }
    #avatars button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; display: block; box-shadow: none; }
    #avatars button .avatar { width: 100% !important; height: 100% !important; box-shadow: none; transition: transform .12s; }
    #avatars button:hover:not(:disabled) { background: none; }
    #avatars button:hover .avatar { transform: scale(1.06); }
    #avatars button.selected { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 16px var(--accent-glow); }
    #avatars button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    .row button { flex: 1; }

    /* Video call */
    .call { padding: 8px; }
    .stage { position: relative; aspect-ratio: 4 / 3; border-radius: 7px; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 20%, #1c1724, #0b090e); border: 1px solid var(--line); }
    #remote { width: 100%; height: 100%; object-fit: cover; display: block; }
    #local { position: absolute; right: 8px; bottom: 8px; width: 28%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 5px;
      transform: scaleX(-1); background: #1d1825; border: 1px solid rgba(255, 255, 255, .15); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }
    #remoteMic { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 5px; font-size: 12px;
      background: rgba(12, 10, 16, .55); border: 1px solid rgba(255, 255, 255, .1); backdrop-filter: blur(10px); }
    #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; color: #a99fb8; } /* the video area is dark in every theme */
    #faces { display: flex; }
    #faces .avatar + .avatar { margin-left: -14px; }
    .controls { display: flex; align-items: center; gap: 6px; padding-top: 8px; }
    .controls .wide { flex: 1; }
    #hangup { margin-left: auto; color: var(--danger); border-color: rgba(229, 134, 143, .35); background: rgba(229, 134, 143, .08); }

    /* Chat */
    .chat { flex: 1; display: flex; flex-direction: column; min-height: 140px; overflow: hidden; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #log:empty::before { content: 'No messages yet.'; color: var(--faint); }
    .line { display: flex; align-items: flex-end; gap: 6px; }
    .line.me { flex-direction: row-reverse; }
    .msg { max-width: 80%; padding: 7px 11px; border-radius: 10px 10px 10px 3px; background: var(--them); border: 1px solid var(--line); overflow-wrap: anywhere; }
    .line.me .msg { border-radius: 10px 10px 3px 10px; background: var(--accent); border-color: transparent; color: var(--accent-ink); }
    .line.me .who { display: none; }
    .line.system { justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 0; }
    .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 1px; }
    .msg.big { background: none !important; border-color: transparent; padding: 0 2px; font-size: 30px; line-height: 1.15; }
    .line.me .msg.big .who { display: none; }
    .stamp { display: inline-block; margin-top: 3px; padding: 0 5px; border: 0; border-radius: 4px; font-size: 10px; font-variant-numeric: tabular-nums;
      background: rgba(0, 0, 0, .18); color: inherit; opacity: .7; box-shadow: none; }
    .stamp:hover:not(:disabled) { opacity: 1; background: rgba(0, 0, 0, .3); }
    .msg.big .stamp { font-size: 10px; vertical-align: middle; margin-left: 4px; color: var(--muted); background: var(--soft); opacity: 1; }
    .line.me .msg.big { color: var(--text); }
    #typing { padding: 0 12px 6px; color: var(--muted); font-size: 12px; font-style: italic; }
    #form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
    #form input { border-radius: 7px; }
    #form button { padding: 7px 9px; }
    #form .icon { color: var(--muted); }
    #form .icon[aria-pressed='true'] { color: var(--accent); border-color: rgba(201, 182, 242, .45); }

    /* Emoji tray (opens above the message box) */
    .tray { border-top: 1px solid var(--line); background: var(--soft); max-height: 280px; overflow-y: auto; padding: 10px 12px;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tray-label { color: var(--muted); font-size: 11px; font-weight: 500; margin: 8px 0 4px; }
    .tray-label:first-child { margin-top: 0; }
    .quick, .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); }
    .quick button, .emoji-grid button { border: 0; background: none; padding: 4px 0; font-size: 20px; line-height: 1.2; border-radius: 6px; }
    .quick button:hover, .emoji-grid button:hover { background: var(--hover); }

    /* Past parties (history) */
    body.show-history #watchBar, body.show-history #followBar, body.show-history #settings,
    body.show-history .call, body.show-history .chat { display: none !important; }
    #historyView { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .hv-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 10px; border-bottom: 1px solid var(--line); }
    .hv-head h2 { flex: 1; margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hv-head button { font-size: 12px; padding: 5px 9px; }
    #sessions, #sessionLog { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #sessions:empty::before { content: 'No past parties yet. When you leave a party, its chat is saved here.'; display: block; padding: 12px 6px; color: var(--faint); }
    .session { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px;
      margin-bottom: 6px; border-radius: 7px; background: var(--soft); }
    .session .s-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .session .s-meta { font-size: 12px; color: var(--muted); }
    #sessionLog { display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <header class="top card">
    <div id="who"></div>
    <div class="meta">
      <div id="names">Sinehan</div>
      <div id="status">Not connected</div>
    </div>
    <button id="invite" class="icon" title="Copy invite link" aria-label="Copy invite link">
      <svg class="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L11.6 6" /><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6" /></svg>
      <svg class="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    </button>
    <button id="historyBtn" class="icon" title="Past parties" aria-label="Past parties" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" /><path d="M3 4v4h4" /><path d="M12 8v4.5l3 1.8" /></svg>
    </button>
    <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings" aria-pressed="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
    </button>
  </header>
  <div id="inviteBox" class="card" hidden><input id="inviteLink" readonly /></div>

  <div id="watchBar" class="card" hidden>
    <img id="watchIcon" alt="" hidden />
    <div class="wb-text">
      <span class="wb-label">Watching</span>
      <span id="watchTitle">Nothing yet</span>
    </div>
    <button id="watchHere" hidden title="Make the tab you're on the show you're watching together">Watch here</button>
    <button id="handBtn" class="icon" title="Hold their hand">🤝</button>
    <button id="countdownBtn" class="icon" title="Count down 3-2-1 and play together">3·2·1</button>
  </div>
  <div id="followBar" class="card" hidden>
    <span id="followText"></span>
    <button id="followGo" class="primary">Go</button>
    <button id="followClose" class="icon" title="Dismiss">✕</button>
  </div>

  <details id="settings" class="card" open>
    <summary hidden>Settings</summary>
    <div class="body">
      <section class="group">
        <h2>Appearance</h2>
        <div class="themes" role="radiogroup" aria-label="Appearance">
          <button type="button" data-theme-choice="glass"><span class="swatch glass"></span>Glass</button>
          <button type="button" data-theme-choice="dark"><span class="swatch dark"></span>Dark</button>
          <button type="button" data-theme-choice="light"><span class="swatch light"></span>Light</button>
        </div>
      </section>
      <section class="group">
        <h2>Profile</h2>
        <div class="profile">
          <div id="myAvatar"></div>
          <label class="field">Name <input id="name" maxlength="30" placeholder="Shown in chat" /></label>
        </div>
        <div id="avatars" role="radiogroup" aria-label="Picture"></div>
      </section>
      <section class="group">
        <h2>Camera & mic</h2>
        <label class="field">Camera <select id="camSelect"></select></label>
        <label class="field">Microphone <select id="micSelect"></select></label>
        <button id="devicePerm" hidden>Allow access to see your devices</button>
      </section>
      <section class="group">
        <h2>Connection</h2>
        <label class="field">Server <input id="server" placeholder="wss://sinehan.live" /></label>
        <label class="field">Room <input id="room" placeholder="Leave empty and Invite makes one" /></label>
        <div class="row">
          <button id="connect" class="primary">Connect</button>
          <button id="disconnect">Leave</button>
        </div>
      </section>
    </div>
  </details>

  <section class="card call">
    <div class="stage">
      <video id="remote" autoplay playsinline></video>
      <video id="local" autoplay playsinline muted hidden></video>
      <div id="remoteMic" hidden title="Their microphone is off">🔇 Mic off</div>
      <div id="placeholder"><div id="faces"></div><div id="phText"></div></div>
    </div>
    <div class="controls">
      <button id="start" class="primary wide">Start video call</button>
      <button id="join" class="primary wide" hidden>Join with camera</button>
      <button id="mic" class="icon" hidden title="Mute / unmute">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
      </button>
      <button id="cam" class="icon" hidden title="Camera on / off">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2" /><path d="M15 10.5l6-3.5v10l-6-3.5" /></svg>
      </button>
      <button id="pip" class="icon" hidden title="Pop out (use before going fullscreen)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><rect x="12" y="11" width="6" height="5" rx="1" /></svg>
      </button>
      <button id="hangup" hidden>Hang up</button>
    </div>
  </section>

  <section class="card chat">
    <div id="log"></div>
    <div id="emojiTray" class="tray" hidden>
      <div class="tray-label">Quick react: sends right away and floats on their screen</div>
      <div id="quick" class="quick"></div>
      <div id="emojiGrid"></div>
    </div>
    <div id="typing" hidden></div>
    <form id="form">
      <button type="button" id="emojiBtn" class="icon" title="Emoji" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01" /></svg>
      </button>
      <input id="msg" maxlength="500" placeholder="Message" autocomplete="off" />
      <button class="primary" title="Send">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </button>
    </form>
  </section>

  <section id="historyView" class="card" hidden>
    <div class="hv-head">
      <button id="historyBack" class="icon" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
      <h2 id="hvTitle">Past parties</h2>
      <button id="historyClear" title="Delete every saved party">Clear all</button>
      <button id="sessionDelete" hidden title="Delete this party">Delete</button>
    </div>
    <div id="sessions"></div>
    <div id="sessionLog" hidden></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
