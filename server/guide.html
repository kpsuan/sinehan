<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a10" />
  <title>sinehan · watch guide</title>
  <link rel="icon" href="/static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #0c0a10; --card: #15111b; --raised: #201a29; --text: #efeaf6; --muted: #9a90aa; --faint: #6d6479;
      --accent: #c9b6f2; --ink: #1b1325; --live: #9fd6b0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font: 15px/1.45 'Inter', system-ui, sans-serif; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
    a { color: inherit; text-decoration: none; }

    /* Header: the show's wide key art on the right, fading into the page; poster, name and what's next */
    .hero { position: relative; isolation: isolate; overflow: hidden; padding: max(18px, env(safe-area-inset-top)) 16px 26px;
      min-height: clamp(380px, 56vh, 600px); display: flex; flex-direction: column; }
    .backdrop { position: absolute; inset: 0 0 0 auto; width: min(100%, 1100px); z-index: -2; background: center 20% / cover no-repeat; opacity: 0; transition: opacity 1s;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 45%); mask-image: linear-gradient(to right, transparent 0%, #000 45%); }
    .backdrop.on { opacity: .9; }
    /* Only a poster to go on (films): blur it across the whole header instead */
    .backdrop.soft { inset: -40px; width: auto; filter: blur(30px) saturate(1.3) brightness(.55); -webkit-mask-image: none; mask-image: none; }
    /* Films: their posters lined up on the right, like a shelf */
    .shelf { position: absolute; inset: 0 0 0 auto; width: min(100%, 980px); z-index: -2; display: flex; align-items: center; justify-content: flex-end; gap: 14px;
      padding: 40px 24px; opacity: 0; transition: opacity 1s; -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 55%); mask-image: linear-gradient(to right, transparent 0%, #000 55%); }
    .shelf.on { opacity: .75; }
    .shelf img { height: min(80%, 400px); aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
    .shelf img:nth-child(even) { transform: translateY(26px); }
    .hero::after { content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(to top, var(--bg) 2%, rgba(12, 10, 16, .55) 38%, rgba(12, 10, 16, .1) 70%),
        linear-gradient(to right, var(--bg) 18%, rgba(12, 10, 16, .4) 55%, transparent 80%); }
    .wrap { max-width: 1240px; margin: 0 auto; width: 100%; }
    .hero .wrap { flex: 1; display: flex; flex-direction: column; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; font-weight: 600; }
    .brand img { width: 24px; height: 24px; }
    /* The poster is as tall as the text beside it: its top meets the kicker, its bottom the button */
    /* The poster sits at the top of the row, level with the kicker */
    .head { display: flex; align-items: flex-start; gap: 28px; margin-top: auto; padding-top: 48px; }
    .poster-wrap { position: relative; flex: none; width: 200px; }
    .poster { display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 10px; object-fit: cover; object-position: top; background: var(--raised); }
    .art-btn { position: absolute; left: 8px; bottom: 8px; padding: 6px 10px; border-radius: 7px; background: rgba(12, 10, 16, .78); color: var(--text);
      font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .15s; }
    .poster-wrap:hover .art-btn, .art-btn:focus-visible { opacity: 1; }
    @media (hover: none) { .art-btn { opacity: 1; } }
    /* Picking another poster or background */
    .picker-panel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: rgba(8, 6, 10, .92); backdrop-filter: blur(10px); }
    .picker-head { display: flex; align-items: center; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 20px 12px; }
    .picker-head h2 { flex: 1; margin: 0; font-size: 18px; }
    .picker-head button { padding: 8px 14px; border-radius: 8px; background: var(--raised); color: var(--text); font-weight: 600; }
    .picker-tabs { display: flex; gap: 6px; padding: 0 20px 12px; }
    .picker-tabs button { padding: 7px 14px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; }
    .picker-tabs button[aria-pressed='true'] { background: var(--raised); color: var(--text); }
    .picker-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 4px 20px 24px; align-content: start; }
    .picker-grid.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .picker-grid button { padding: 0; border-radius: 8px; overflow: hidden; background: var(--raised); }
    .picker-grid img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
    .picker-grid.wide img { aspect-ratio: 16 / 9; }
    .picker-grid button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .picker-grid .own { display: grid; place-items: center; aspect-ratio: 2 / 3; border-radius: 8px; background: var(--raised); color: var(--muted);
      font-size: 13px; font-weight: 600; text-align: center; padding: 10px; cursor: pointer; }
    .picker-grid.wide .own { aspect-ratio: 16 / 9; }
    .picker-grid .own:hover { color: var(--text); background: #2a2334; }
    .picker-reset { padding: 0 20px 20px; }
    .picker-reset button { color: var(--muted); font-size: 13px; text-decoration: underline; }
    .kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 6px 0 4px; font-size: clamp(36px, 7vw, 68px); line-height: 1.02; letter-spacing: -0.035em; overflow-wrap: anywhere; text-shadow: 0 2px 24px rgba(0, 0, 0, .45); }
    .topic { margin: 0; font-size: clamp(18px, 2.4vw, 24px); font-weight: 500; color: var(--text); opacity: .92; }
    .show-meta { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .summary { margin: 12px 0 0; max-width: 560px; color: #cfc7da; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .head-text { min-width: 0; }
    .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; padding: 12px 20px 12px 16px; border-radius: 10px; background: var(--accent); color: var(--ink);
      font-weight: 600; font-size: 15px; max-width: 100%; }
    .cta:hover { background: #d8c9f7; }
    .cta svg { flex: none; width: 18px; height: 18px; fill: currentColor; }
    .cta span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cta small { font-weight: 500; opacity: .7; font-size: 14px; }
    .progress { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
    .progress b { color: var(--text); }
    .sync { display: inline-flex; align-items: center; gap: 6px; }
    .sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5a5066; }
    .sync.live::before { background: var(--live); }
    .bar { margin-top: 8px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s; }

    /* The list: pick a season, then a grid of episodes */
    main { padding: 0 16px max(32px, env(safe-area-inset-bottom)); }
    .wrap { max-width: 1240px; }
    .bar-row { display: flex; align-items: center; gap: 14px; margin: 26px 0 18px; flex-wrap: wrap; }
    .picker { position: relative; }
    .picker select { appearance: none; -webkit-appearance: none; padding: 10px 40px 10px 16px; border: 0; border-radius: 10px; background: var(--raised);
      color: var(--text); font: 600 16px 'Inter', system-ui, sans-serif; cursor: pointer; }
    .picker::after { content: ''; position: absolute; right: 17px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
    .picker select:hover { background: #2a2334; }
    .shown { color: var(--muted); font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px 22px; }
    .grid.films { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .section { grid-column: 1 / -1; margin: 10px 0 -12px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .ep { position: relative; min-width: 0; }
    .shot { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--raised); }
    .films .shot { aspect-ratio: 2 / 3; }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease, opacity .3s, filter .3s; }
    .ep:hover .shot img { transform: scale(1.03); }
    .shot .no { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 22px; font-weight: 600; }
    .ep.done .shot img { opacity: .45; filter: grayscale(.5); }
    /* The line under the picture: full once you've watched it */
    .shot::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, .14); }
    .ep.done .shot::after { background: var(--accent); }
    .chip { position: absolute; right: 8px; bottom: 12px; padding: 3px 8px; border-radius: 5px; background: rgba(12, 10, 16, .78); font-size: 12px; font-weight: 700; }
    .chip.next { color: var(--accent); }
    .tick { position: absolute; top: 8px; right: 8px; z-index: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(12, 10, 16, .7); color: var(--text); transition: background .2s, transform .1s, opacity .2s; }
    .tick:active { transform: scale(.9); }
    .tick svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .tick:not(.on) svg { opacity: .55; }
    .tick:hover { background: rgba(12, 10, 16, .9); }
    .tick.on { background: var(--accent); color: var(--ink); }
    .ep-title { display: block; margin-top: 12px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
    .ep.done .ep-title { color: var(--muted); }
    .desc { margin: 6px 0 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
    .meta .src { padding: 0 6px; border-radius: 4px; background: rgba(201, 182, 242, .12); color: var(--accent); font-size: 11.5px; font-weight: 600; line-height: 20px; }

    .add { margin: 34px 0 0; display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
    .add label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .add-row { display: flex; gap: 8px; }
    .add input { flex: 1; min-width: 0; padding: 11px 14px; border: 0; border-radius: 10px; background: var(--raised); color: var(--text); font: 15px 'Inter', system-ui, sans-serif; outline: none; }
    .add input:focus { box-shadow: 0 0 0 2px var(--accent); }
    .add button { flex: none; padding: 0 20px; border-radius: 10px; background: var(--accent); color: var(--ink); font-weight: 600; }
    .add-note { margin: 0; color: var(--muted); font-size: 13px; }
    .foot { margin: 30px 4px 0; color: var(--faint); font-size: 13px; }
    .foot a { color: var(--muted); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .2); }
    .empty { max-width: 460px; margin: 60px auto; padding: 0 16px; color: var(--muted); text-align: center; }
    .empty svg { display: block; width: 150px; height: auto; margin: 0 auto 18px; }

    @media (max-width: 560px) {
      .hero { min-height: 0; }
      .head { gap: 16px; padding-top: 28px; align-items: flex-end; }
      .poster-wrap { width: 96px; align-self: flex-end; }
      .summary { display: none; }
      /* Phones: the key art as a banner on top, the name and button below it */
      .backdrop { inset: 0 0 auto 0; width: 100%; height: 230px; -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
      .backdrop.soft { inset: -40px; height: auto; }
      .backdrop.on ~ .wrap .head, .shelf.on ~ .wrap .head { padding-top: 150px; }
      .hero::after { background: linear-gradient(to top, var(--bg) 30%, rgba(12, 10, 16, .35) 70%, transparent); }
      .shelf { inset: 0 0 auto 0; width: 100%; height: 240px; padding: 20px 16px; gap: 10px; justify-content: center; -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 100%); mask-image: linear-gradient(to bottom, #000 40%, transparent 100%); }
      .shelf img { height: 170px; }
      .cta { margin-top: 14px; padding: 10px 16px 10px 13px; font-size: 14px; }
      .grid { grid-template-columns: 1fr; gap: 24px; }
      .grid.films { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
      .ep-title { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="shelf" id="shelf" aria-hidden="true"></div>
    <div class="wrap">
      <a class="brand" href="/"><img src="/static/logo.png" alt="" />sinehan</a>
      <div class="head">
        <div class="poster-wrap" id="posterWrap" hidden>
          <img class="poster" id="poster" alt="" />
          <button class="art-btn" id="artBtn" type="button" hidden>Change picture</button>
        </div>
        <div class="head-text">
          <p class="kicker">Watch guide</p>
          <h1 id="show"></h1>
          <p class="topic" id="topic" hidden></p>
          <p class="show-meta" id="showMeta" hidden></p>
          <p class="summary" id="summary" hidden></p>
          <button class="cta" id="cta" hidden><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" /></svg><span id="ctaText"></span></button>
        </div>
      </div>
      <div class="progress"><span id="count"></span><span class="sync" id="sync">Saved on this device</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <div class="picker-panel" id="picker" hidden role="dialog" aria-label="Choose artwork">
    <div class="picker-head"><h2>Choose artwork</h2><button type="button" id="pickerClose">Done</button></div>
    <div class="picker-tabs">
      <button type="button" id="pickPosters" aria-pressed="true">Poster</button>
      <button type="button" id="pickBackgrounds" aria-pressed="false">Background</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
    <div class="picker-reset"><button type="button" id="pickerReset">Use the newest again</button></div>
  </div>

  <main id="main" hidden>
    <div class="wrap">
      <div class="bar-row">
        <label class="picker"><select id="season" aria-label="Season"></select></label>
        <span class="shown" id="shown"></span>
      </div>
      <div class="grid" id="list"></div>
      <form class="add" id="addForm">
        <label for="addInput">Add to this guide</label>
        <div class="add-row">
          <input id="addInput" maxlength="100" autocomplete="off" placeholder="S2E5, 2x05 or the episode's title" />
          <button type="submit">Add</button>
        </div>
        <p class="add-note" id="addNote" hidden></p>
      </form>
      <p class="foot">Tap a picture to read about it on the fan wiki, and the circle when you've watched it. Made with <a href="/">Sinehan</a>, a movie theater for two.</p>
    </div>
  </main>

  <p class="empty" id="empty" hidden>This link doesn't have a watch guide in it. Ask for a new link, or make one in the Sinehan sidebar.</p>

  <script src="/static/bantay.js"></script>
  <script>
    // The guide travels in the link itself (after #, which browsers never send to the server). Ticks are
    // kept on this device, and if the link came from a party, they sync live with it through the relay.
    // Pictures and air dates are looked up from TVmaze (series) or Wikipedia (films) by this browser.
    (async () => {
      const $ = (id) => document.getElementById(id);
      const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';
      const norm = (s) => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
      const flat = (s) => norm(s).replace(/^the /, '').replace(/ /g, '');
      // Text from a guide post, readable (same as the sidebar's).
      function cleanReason(text, title = '') {
        let t = String(text || '')
          .replace(/>!(.*?)!</g, '$1').replace(/>!|!</g, '') // spoiler tags (and unclosed ones)
          .replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g, '$1') // markdown escapes like \-
          .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1') // links
          .replace(/(\*\*|__|~~|`)/g, '') // bold, underline, strike, code
          .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu, '') // emoji markers
          .replace(/^\s*(#{1,6}|>+)\s*/gm, '')
          .replace(/\s+/g, ' ')
          .trim();
        // The card already shows the episode and its title: drop them from the front.
        t = t.replace(/^[\s*>•·\-–—]*(s\d+\s*e\d+|\d{1,2}\s*[x×]\s*\d{1,3}|ep(isode)?\.?\s*\d+)\s*[-–—:|.]*\s*/i, '');
        const flat = (x) => String(x || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
        if (title && flat(t).startsWith(flat(title))) {
          let i = 0;
          for (let n = 0; i < t.length && n < flat(title).length; i++) if (/[\p{L}\p{N}]/u.test(t[i])) n++;
          t = t.slice(i);
        }
        return t.replace(/^[\s\-–—:|,.*!]+/, '').trim();
      }

      async function decode(text) {
        const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return JSON.parse(await new Response(stream).text());
      }
      let g;
      try {
        g = await decode(new URLSearchParams(location.hash.slice(1)).get('g') || '');
        if (!g?.s || !(Array.isArray(g.e) || typeof g.k === 'string')) throw new Error('no guide');
      } catch {
        $('empty').hidden = false;
        if (window.Bantay) $('empty').insertAdjacentHTML('afterbegin', Bantay.svg('tilt')); // fixed markup
        return;
      }

      const KEY = /^(S\d+E\d+|T:[\p{L}\p{N} ]{1,100})$/u;
      // Compact links (v2) carry only which episodes; older ones carry titles and descriptions too.
      const KINDS = { F: 'Films', S: 'Series', X: 'Short films' };
      const rows = Array.isArray(g.e) ? g.e
        : /^\d+\.\d+( \d+\.\d+)*$/.test(g.k.trim()) ? g.k.trim().split(' ').map((x) => [`S${x.replace('.', 'E')}`, '', '', ''])
        : g.k.split('\n').filter(Boolean).map((x) => [`T:${norm(x.slice(1)).slice(0, 100)}`, x.slice(1), '', KINDS[x[0]] || 'Films']);
      const episodes = rows.filter((e) => Array.isArray(e) && KEY.test(e[0])).slice(0, 200)
        .map(([key, title, reason, kind]) => ({ key, title: String(title || '').slice(0, 120), reason: String(reason || '').slice(0, 160), kind: String(kind || '').slice(0, 20) }));
      const id = String(g.id || `${norm(g.s)}|${norm(g.t)}`).slice(0, 200); // same id the sidebar gives it
      let wiki = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.fandom\.com$/.test(g.f || '') ? g.f : '';
      const info = new Map(); // key -> { img, portrait, meta, url }

      // Ticks: what the link carried, then this device's own, then live ones (newest wins).
      const store = `sinehan-guide:${id}`;
      let done = {};
      const ticked = Array.isArray(g.d) ? g.d : String(g.d || '').split(' ').filter(Boolean).map((i) => episodes[Number(i)]?.key);
      for (const k of ticked) if (k) done[k] = { v: true, at: 0 };
      try { Object.assign(done, JSON.parse(localStorage.getItem(store) || '{}')); } catch {}
      const save = () => { try { localStorage.setItem(store, JSON.stringify(done)); } catch {} };
      // The artwork someone picked: { poster, background, at } (URLs; '' = the newest). From the link, then
      // this device, then live from the party; the newest choice wins.
      const ART_URL = /^(https:\/\/static\.tvmaze\.com\/uploads\/images\/[\w/.-]+|data:image\/jpeg;base64,[A-Za-z0-9+/=]+)$/;
      const cleanArt = (x) => (typeof x === 'string' && x.length < 60000 && (x === '' || ART_URL.test(x)) ? x : undefined);
      const artStore = `sinehan-guide-art:${id}`;
      let picked = { poster: '', background: '', at: 0 };
      const fromLink = g.a && typeof g.a === 'object' ? g.a : null;
      if (fromLink) picked = { poster: cleanArt(fromLink.p ? `https://static.tvmaze.com/uploads/images/${fromLink.p}` : '') || '', background: cleanArt(fromLink.b ? `https://static.tvmaze.com/uploads/images/${fromLink.b}` : '') || '', at: Number(fromLink.at) || 0 };
      try {
        const mine = JSON.parse(localStorage.getItem(artStore) || 'null');
        if (mine && mine.at > picked.at) picked = { poster: cleanArt(mine.poster) || '', background: cleanArt(mine.background) || '', at: mine.at };
      } catch {}
      const saveArt = () => { try { localStorage.setItem(artStore, JSON.stringify(picked)); } catch {} };
      let onArt = null;
      const shareArt = () => {
        if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'guide-art', id, poster: picked.poster, background: picked.background, at: picked.at }));
      };
      const takeArt = (a) => {
        if (!a || !(Number(a.at) > picked.at)) return;
        const poster = cleanArt(a.poster);
        const background = cleanArt(a.background);
        if (poster === undefined || background === undefined) return;
        picked = { poster, background, at: Number(a.at) };
        saveArt();
        onArt?.();
      };

      const addedStore = `sinehan-guide-added:${id}`;
      const ADD_KEY = /^(S\d+E\d+|T:[\p{L}\p{N} ]{1,100})$/u;
      // Put an episode into the list, in order (from this page, or added by someone in the party).
      function insertEpisode(e) {
        if (!ADD_KEY.test(e.key || '') || episodes.some((x) => x.key === e.key)) return false;
        episodes.push({ key: e.key, title: String(e.title || '').slice(0, 120), reason: '', kind: String(e.kind || '').slice(0, 20), added: true });
        const n = (k) => k.match(/^S(\d+)E(\d+)$/)?.slice(1).map(Number) || [0, 0];
        if (!episodes.some((x) => x.kind)) episodes.sort((a, b) => n(a.key)[0] - n(b.key)[0] || n(a.key)[1] - n(b.key)[1]);
        return true;
      }
      try { for (const e of JSON.parse(localStorage.getItem(addedStore) || '[]')) insertEpisode(e); } catch {}
      const rememberAdded = (e) => {
        try {
          const list = JSON.parse(localStorage.getItem(addedStore) || '[]');
          localStorage.setItem(addedStore, JSON.stringify([...list.filter((x) => x.key !== e.key), e].slice(-100)));
        } catch {}
      };

      document.title = `${g.s}${g.t ? ` · ${g.t}` : ''} · watch guide`;
      $('show').textContent = g.s;
      if (g.t) {
        $('topic').textContent = g.t;
        $('topic').hidden = false;
      }
      $('hero').hidden = $('main').hidden = false;

      // Where an episode links: its page on the show's fan wiki, else what TVmaze or Wikipedia has.
      const linkFor = (e) => (wiki ? `https://${wiki}/wiki/Special:Search?search=${encodeURIComponent(e.title || e.key)}&go=Go` : info.get(e.key)?.url || '');

      // Which season is showing ("all", "S3", or "Films"); starts on the one with what's up next.
      const sectionOf = (e) => e.kind || `S${e.key.match(/^S(\d+)/)?.[1] || ''}`;
      const sectionName = (sec) => (/^S\d+$/.test(sec) ? `Season ${sec.slice(1)}` : sec);
      let sections = [...new Set(episodes.map(sectionOf))];
      let showing = null;
      $('season').onchange = () => {
        showing = $('season').value;
        render();
        window.scrollTo({ top: $('main').offsetTop - 8, behavior: 'smooth' });
      };

      let firstRender = true;
      function render() {
        sections = [...new Set(episodes.map(sectionOf))];
        const isDone = (k) => !!done[k]?.v;
        const watched = episodes.filter((e) => isDone(e.key)).length;
        const films = episodes.some((e) => e.kind);
        const noun = films ? 'title' : 'episode';
        const plural = (n) => `${n} ${noun}${n === 1 ? '' : 's'}`;
        $('count').innerHTML = `<b>${watched}</b> of ${plural(episodes.length)} watched`;
        $('bar').style.width = `${episodes.length ? (watched / episodes.length) * 100 : 0}%`;
        const next = episodes.find((e) => !isDone(e.key));
        if (showing == null) showing = sections.length > 1 && next ? sectionOf(next) : 'all';

        // The picker: every season (or Films / Series) in this guide, plus all of them.
        const options = [['all', sections.length > 1 ? (films ? 'Everything' : 'All seasons') : sectionName(sections[0] || 'all')], ...(sections.length > 1 ? sections.map((x) => [x, sectionName(x)]) : [])];
        $('season').replaceChildren(...options.map(([v, label]) => new Option(label, v, false, v === showing)));
        $('season').parentElement.hidden = false;

        // The header's button: what's next, and a jump to it.
        $('cta').hidden = !next;
        if (next) {
          const what = next.kind ? next.title : `${next.key.replace(/^S(\d+)E(\d+)$/, 'S$1 E$2')}${(next.title || info.get(next.key)?.title) ? ` · ${next.title || info.get(next.key)?.title}` : ''}`;
          $('ctaText').innerHTML = '';
          $('ctaText').append('Up next ', Object.assign(document.createElement('small'), { textContent: what }));
          $('cta').onclick = () => {
            if (showing !== 'all' && sectionOf(next) !== showing) {
              showing = sectionOf(next);
              render();
            }
            document.querySelector(`[data-key="${CSS.escape(next.key)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          };
        }

        const list = showing === 'all' ? episodes : episodes.filter((e) => sectionOf(e) === showing);
        $('shown').textContent = plural(list.length);
        $('list').classList.toggle('films', films);
        const out = [];
        let section = null;
        for (const e of list) {
          if (showing === 'all' && sections.length > 1 && sectionOf(e) !== section) {
            section = sectionOf(e);
            const h = document.createElement('div');
            h.className = 'section';
            h.textContent = sectionName(section);
            out.push(h);
          }
          const extra = info.get(e.key) || {};
          const card = document.createElement('article');
          card.className = `ep${isDone(e.key) ? ' done' : ''}`;
          card.dataset.key = e.key;
          const href = linkFor(e);
          const linkTo = (el) => {
            if (!href) return el;
            el.href = href;
            el.target = '_blank';
            el.rel = 'noopener';
            return el;
          };

          const shot = linkTo(document.createElement('a'));
          shot.className = 'shot';
          if (extra.img) {
            const img = document.createElement('img');
            img.src = extra.img;
            img.alt = '';
            img.loading = 'lazy';
            shot.append(img);
          } else {
            const no = document.createElement('span');
            no.className = 'no';
            no.textContent = e.kind ? '' : e.key.replace(/^S(\d+)E(\d+)$/, '$1×$2');
            shot.append(no);
          }
          if (e === next) {
            const chip = document.createElement('span');
            chip.className = 'chip next';
            chip.textContent = 'Up next';
            shot.append(chip);
          }
          const tick = document.createElement('button');
          tick.className = `tick${isDone(e.key) ? ' on' : ''}`;
          tick.title = isDone(e.key) ? 'Watched. Tap to undo' : 'Mark as watched';
          tick.setAttribute('aria-pressed', String(isDone(e.key)));
          tick.innerHTML = CHECK; // fixed markup
          tick.onclick = () => setTick(e.key, !isDone(e.key));

          const title = linkTo(document.createElement('a'));
          title.className = 'ep-title';
          const n = e.key.match(/^S\d+E(\d+)$/)?.[1];
          title.textContent = `${n ? `${n}. ` : ''}${e.title || extra.title || e.key.replace(/^S(\d+)E(\d+)$/, 'Season $1, episode $2')}`;
          card.append(shot, tick, title);

          const about = (e.reason && !/^\d{4}$/.test(e.reason) && cleanReason(e.reason, e.title)) || extra.summary;
          if (about) {
            const desc = document.createElement('p');
            desc.className = 'desc';
            desc.textContent = about;
            card.append(desc);
          }
          const meta = document.createElement('div');
          meta.className = 'meta';
          const bits = [showing === 'all' && !e.kind && sections.length > 1 ? e.key.replace(/^S(\d+)E(\d+)$/, 'S$1 E$2') : '', ...(extra.bits || [])].filter(Boolean);
          for (const b of bits) {
            const x = document.createElement('span');
            x.textContent = b;
            meta.append(x);
          }
          if (meta.childElementCount) card.append(meta);
          out.push(card);
        }
        const y = window.scrollY;
        $('list').replaceChildren(...out);
        if (!firstRender) window.scrollTo(0, y);
        firstRender = false;
      }

      function setBackdrop(url, soft) {
        if (!url) return;
        $('backdrop').style.backgroundImage = `url("${url}")`;
        $('backdrop').classList.toggle('soft', !!soft);
        $('backdrop').classList.add('on');
      }

      // ---- Pictures and details ----
      const longDate = (d) => (d ? new Date(`${d}T12:00:00`).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '');
      // ---- Artwork (a TVmaze show, or none: then just your own pictures) ----
      const art = (x) => String(x || '').replace(/^http:/, 'https:');
      function setupArt(show) {
      // Artwork: the newest by default, or what someone picked. The choice is shared: with the party
      // (live), and in the guide's link (pictures from TVmaze; uploads go to the party only).
      let posters = [];
      let backgrounds = [];
      const newest = (list) => [...list].sort((a, b) => b.id - a.id)[0];
      const src = (img, size) => art(img?.resolutions?.[size]?.url || img?.resolutions?.original?.url);
      const applyArt = () => {
        const def = posters.find((x) => x.main) || newest(posters);
        const posterUrl = picked.poster || (def ? src(def, 'medium') : art(show?.image?.medium));
        if (posterUrl) {
          $('poster').src = posterUrl;
          $('posterWrap').hidden = false;
        }
        const bg = newest(backgrounds);
        if (picked.background) setBackdrop(picked.background, false);
        else if (show) setBackdrop(bg ? src(bg, 'original') : art(show.image?.original), !bg);
      };
      onArt = applyArt;
      applyArt();
      if (!show) {
        $('posterWrap').hidden = false; // a blank poster you can put a picture on
        $('artBtn').hidden = false;
      } else fetch(`https://api.tvmaze.com/shows/${show.id}/images`).then((x) => x.json()).then((images) => {
        posters = images.filter((x) => x.type === 'poster').sort((a, b) => b.id - a.id);
        backgrounds = images.filter((x) => x.type === 'background').sort((a, b) => b.id - a.id);
        applyArt();
      }).catch(() => {}).then(() => fetch(`https://api.tvmaze.com/shows/${show.id}/seasons`)).then((x) => x.json()).then((seasons) => {
        // Each season's own poster too, newest season first.
        for (const se of [...seasons].reverse()) {
          if (se.image?.medium) posters.push({ id: `season-${se.number}`, type: 'poster', resolutions: { medium: { url: se.image.medium }, original: { url: se.image.original } } });
        }
      }).catch(() => {}).finally(() => ($('artBtn').hidden = false));

      // The picker: every poster or background TVmaze has, newest first, or your own.
      let pickKind = 'poster';
      const choose = (url) => {
        picked = { ...picked, [pickKind]: url, at: Date.now() };
        saveArt();
        shareArt();
        applyArt();
        showPicker();
      };
      const showPicker = () => {
        const list = pickKind === 'poster' ? posters : backgrounds;
        const def = pickKind === 'poster' ? posters.find((x) => x.main) || newest(posters) : newest(backgrounds);
        const current = picked[pickKind] || (def && src(def, pickKind === 'poster' ? 'medium' : 'original'));
        $('pickPosters').setAttribute('aria-pressed', String(pickKind === 'poster'));
        $('pickBackgrounds').setAttribute('aria-pressed', String(pickKind !== 'poster'));
        $('pickerGrid').classList.toggle('wide', pickKind !== 'poster');
        // First tile: your own picture, shrunk so it can be sent to your party.
        const own = document.createElement('label');
        own.className = 'own';
        own.innerHTML = '<span>Upload your own</span><input type="file" accept="image/*" hidden>'; // fixed markup
        own.querySelector('input').onchange = async (ev) => {
          const file = ev.target.files?.[0];
          if (!file) return;
          const bitmap = await createImageBitmap(file).catch(() => null);
          if (!bitmap) return;
          const shrink = (w, q) => {
            const c = document.createElement('canvas');
            c.width = Math.min(w, bitmap.width);
            c.height = Math.round((bitmap.height * c.width) / bitmap.width);
            c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
            return c.toDataURL('image/jpeg', q);
          };
          // Small enough to send (the relay takes messages up to 64 KB).
          let url = pickKind === 'poster' ? shrink(360, 0.8) : shrink(960, 0.72);
          if (url.length > 56000) url = pickKind === 'poster' ? shrink(260, 0.7) : shrink(720, 0.6);
          if (url.length > 56000) url = pickKind === 'poster' ? shrink(200, 0.6) : shrink(560, 0.55);
          choose(url);
        };
        $('pickerGrid').replaceChildren(own, ...list.map((img) => {
          const url = src(img, pickKind === 'poster' ? 'medium' : 'original');
          const b = document.createElement('button');
          b.type = 'button';
          b.className = url === current ? 'on' : '';
          const i = document.createElement('img');
          i.src = url;
          i.alt = '';
          i.loading = 'lazy';
          b.append(i);
          b.onclick = () => choose(url);
          return b;
        }));
        $('picker').hidden = false;
      };
      $('artBtn').onclick = () => { pickKind = 'poster'; showPicker(); };
      $('pickPosters').onclick = () => { pickKind = 'poster'; showPicker(); };
      $('pickBackgrounds').onclick = () => { pickKind = 'background'; showPicker(); };
      $('pickerClose').onclick = () => ($('picker').hidden = true);
      $('pickerReset').onclick = () => {
        picked = { poster: '', background: '', at: Date.now() };
        saveArt();
        shareArt();
        applyArt();
        showPicker();
      };
      document.addEventListener('keydown', (ev) => ev.key === 'Escape' && ($('picker').hidden = true));
      }

      async function seriesDetails() {
        try {
          const r = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(g.s)}&embed=episodes`);
          if (!r.ok) return setupArt(null);
          const show = await r.json();
          if (flat(show.name) !== flat(g.s)) return setupArt(null); // not sure it's the same show: no pictures rather than wrong ones
          $('show').textContent = officialName = show.name; // its official name ("911" -> "9-1-1")
          const art = (x) => String(x || '').replace(/^http:/, 'https:');
          setupArt(show);
          const about = String(show.summary || '').replace(/<[^>]+>/g, '').trim();
          if (about) {
            $('summary').textContent = about;
            $('summary').hidden = false;
          }
          const eps = show._embedded?.episodes || [];
          const seasons = new Set(eps.map((e) => e.season)).size;
          $('showMeta').textContent = [show.premiered?.slice(0, 4), seasons && `${seasons} season${seasons === 1 ? '' : 's'}`, show.network?.name || show.webChannel?.name].filter(Boolean).join(' · ');
          $('showMeta').hidden = false;
          for (const e of eps) {
            info.set(`S${e.season}E${e.number}`, {
              title: e.name || '',
              img: art(e.image?.original || e.image?.medium),
              bits: [e.runtime && `${e.runtime} min`, longDate(e.airdate)].filter(Boolean),
              summary: String(e.summary || '').replace(/<[^>]+>/g, '').trim(),
              url: e.url,
            });
          }
          render();
        } catch {
          if ($('posterWrap').hidden) setupArt(null);
        }
      }
      async function filmDetails() {
        const list = episodes.filter((e) => e.kind).slice(0, 60);
        const one = async (e) => {
          try {
            const what = e.kind === 'Series' ? 'TV series' : e.kind === 'Films' ? 'film' : 'short film';
            const r = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(`${e.title} ${what}`)}&gsrlimit=1`
              + '&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=480&pilicense=any&format=json&formatversion=2&origin=*');
            const page = (await r.json())?.query?.pages?.[0];
            if (page) info.set(e.key, { img: page.thumbnail?.source || '', bits: e.reason && /^\d{4}$/.test(e.reason) ? [e.reason] : [], url: page.fullurl });
          } catch {}
        };
        const queue = [...list];
        await Promise.all(Array.from({ length: 4 }, async () => {
          while (queue.length) await one(queue.shift());
        }));
        // The films' posters, lined up in the header.
        const posters = list.map((e) => info.get(e.key)?.img).filter(Boolean).slice(0, window.innerWidth < 560 ? 4 : 5);
        if (posters.length) {
          $('shelf').replaceChildren(...posters.map((src) => Object.assign(document.createElement('img'), { src, alt: '' })));
          $('shelf').classList.add('on');
        }
        render();
      }

      // Older links don't name the fan wiki: find it from the show's name ("9-1-1" -> 9-1-1.fandom.com).
      async function findWiki(names) {
        const slugs = [...new Set(names.filter(Boolean).flatMap((n) => {
          const flatName = norm(n).replace(/ /g, '');
          const dashed = norm(n).replace(/ /g, '-');
          return [flatName, flatName.replace(/^the/, ''), dashed, dashed.replace(/^the-/, '')];
        }))].filter((x) => x.length >= 3);
        for (const slug of slugs.slice(0, 6)) {
          try {
            const r = await fetch(`https://${slug}.fandom.com/api.php?action=query&meta=siteinfo&format=json&origin=*`);
            if (r.ok && (r.headers.get('content-type') || '').includes('json') && (await r.json())?.query?.general) return new URL(r.url).host;
          } catch {}
        }
        return '';
      }
      let officialName = '';
      async function linkToWiki() {
        if (wiki) return;
        wiki = await findWiki([g.s, officialName]);
        if (wiki) render();
      }

      // ---- Adding an episode ----
      $('addInput').placeholder = episodes.some((e) => e.kind) ? 'A film or series, by its title' : "S2E5, 2x05 or the episode's title";
      $('addForm').onsubmit = (ev) => {
        ev.preventDefault();
        const text = $('addInput').value.trim();
        if (!text) return;
        const note = (msg) => {
          $('addNote').textContent = msg;
          $('addNote').hidden = false;
        };
        let e;
        if (episodes.some((x) => x.kind)) {
          e = { key: `T:${norm(text).slice(0, 100)}`, title: text.slice(0, 120), kind: /\bseries\b/i.test(text) ? 'Series' : 'Films' };
        } else {
          const m = text.match(/s(?:eason)?\s*(\d{1,2})\s*[,.\-:]?\s*e(?:p(?:isode)?)?\.?\s*(\d{1,3})/i) || text.match(/\b(\d{1,2})\s*[x×]\s*(\d{1,3})\b/);
          let key = m ? `S${Number(m[1])}E${Number(m[2])}` : '';
          if (!key) {
            // by title, from the show's episode list
            const want = norm(text);
            for (const [k, x] of info) if (x.title && norm(x.title) === want) key = k;
            if (!key) for (const [k, x] of info) if (x.title && norm(x.title).startsWith(want) && want.length >= 4) { key = k; break; }
          }
          if (!key) return note("Couldn't tell which episode. Try S2E5, or its exact title.");
          if (info.size && !info.has(key)) return note(`${key.replace(/^S(\d+)E(\d+)$/, 'S$1 E$2')} isn't in ${g.s}'s episode list.`);
          e = { key, title: info.get(key)?.title || '' };
        }
        if (!insertEpisode(e)) return note('That one is already in this guide.');
        rememberAdded(e);
        if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'guide-add', id, key: e.key, title: e.title, kind: e.kind || '' }));
        showing = sectionOf(episodes.find((x) => x.key === e.key));
        render();
        $('addInput').value = '';
        note(`Added ${e.title || e.key.replace(/^S(\d+)E(\d+)$/, 'S$1 E$2')}${ws?.readyState === 1 ? '. Your party sees it too.' : '.'}`);
        document.querySelector(`[data-key="${CSS.escape(e.key)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };

      // ---- Live ticks with the party ----
      let ws = null;
      function setTick(key, v) {
        const t = { v, at: Date.now() };
        done[key] = t;
        save();
        render();
        if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'guide-tick', id, key, v, at: t.at }));
      }
      function connect() {
        // Only links made for a party carry a guide channel (never the party's room).
        if (!/^[0-9a-f]{24}$/.test(g.c || '') || !/^wss?:\/\//.test(g.w || '')) return;
        ws = new WebSocket(g.w);
        ws.onopen = () => {
          ws.send(JSON.stringify({ type: 'guide-join', channel: g.c }));
          $('sync').textContent = 'Syncing with your party';
          $('sync').classList.add('live');
        };
        ws.onmessage = (m) => {
          let msg;
          try { msg = JSON.parse(m.data); } catch { return; }
          if (msg.type === 'guide-tick' && msg.id === id && KEY.test(msg.key || '')) {
            if (!done[msg.key] || msg.at >= done[msg.key].at) {
              done[msg.key] = { v: !!msg.v, at: Number(msg.at) || Date.now() };
              save();
              render();
            }
          } else if (msg.type === 'guide-art' && msg.id === id) {
            takeArt(msg);
          } else if (msg.type === 'guide-add' && msg.id === id) {
            if (insertEpisode({ key: msg.key, title: msg.title, kind: msg.kind })) render();
          } else if (msg.type === 'guide-sync' && msg.guide?.id === id) {
            for (const e of Array.isArray(msg.guide.episodes) ? msg.guide.episodes.slice(0, 200) : []) insertEpisode(e);
            takeArt(msg.guide.art);
            for (const [k, t] of Object.entries(msg.guide.done || {})) {
              if (KEY.test(k) && t && (!done[k] || t.at > done[k].at)) done[k] = { v: !!t.v, at: t.at };
            }
            save();
            render();
          }
        };
        ws.onclose = () => {
          $('sync').textContent = 'Saved on this device';
          $('sync').classList.remove('live');
          setTimeout(connect, 4000);
        };
      }
      setInterval(() => ws?.readyState === 1 && ws.send(JSON.stringify({ type: 'ping' })), 20000);

      render();
      connect();
      if (episodes.some((e) => e.kind)) filmDetails().then(linkToWiki);
      else seriesDetails().then(linkToWiki);
    })();
  </script>
</body>
</html>
