<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a10" />
  <title>sinehan · watch guide</title>
  <link rel="icon" href="/static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #0c0a10; --card: #15111b; --raised: #201a29; --text: #efeaf6; --muted: #9a90aa; --faint: #6d6479;
      --accent: #c9b6f2; --ink: #1b1325; --live: #9fd6b0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font: 15px/1.45 'Inter', system-ui, sans-serif; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
    a { color: inherit; text-decoration: none; }

    /* Header: the show's artwork, blurred behind its poster and name */
    .hero { position: relative; isolation: isolate; overflow: hidden; padding: max(16px, env(safe-area-inset-top)) 16px 22px; }
    .backdrop { position: absolute; inset: -40px; z-index: -2; background: center 25% / cover no-repeat; filter: blur(28px) saturate(1.3) brightness(.5); opacity: 0; transition: opacity .8s; }
    .backdrop.on { opacity: 1; }
    .hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgba(12, 10, 16, .2), var(--bg) 96%); }
    .wrap { max-width: 760px; margin: 0 auto; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .brand img { width: 22px; height: 22px; }
    .head { display: flex; align-items: flex-end; gap: 18px; margin-top: 26px; }
    .poster { flex: none; width: 108px; aspect-ratio: 2 / 3; border-radius: 10px; object-fit: cover; background: var(--raised); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
    .kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 4px 0 2px; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -0.025em; overflow-wrap: anywhere; }
    .topic { margin: 0; font-size: 17px; font-weight: 500; color: var(--accent); }
    .show-meta { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .progress { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
    .progress b { color: var(--text); }
    .sync { display: inline-flex; align-items: center; gap: 6px; }
    .sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5a5066; }
    .sync.live::before { background: var(--live); }
    .bar { margin-top: 8px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s; }

    /* The list */
    main { padding: 0 16px max(32px, env(safe-area-inset-bottom)); }
    .section { margin: 26px 4px 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .ep { position: relative; display: flex; align-items: stretch; margin-bottom: 8px; border-radius: 14px; background: var(--card); overflow: hidden; transition: background .15s; }
    .ep:hover { background: #1a1522; }
    .ep.next { background: #211a2c; }
    .ep-link { flex: 1; min-width: 0; display: flex; gap: 14px; padding: 10px; }
    .thumb { position: relative; flex: none; width: 168px; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; background: var(--raised); display: grid; place-items: center; }
    .thumb.portrait { width: 76px; aspect-ratio: 2 / 3; }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s, filter .3s; }
    .thumb .no { color: var(--faint); font-size: 13px; font-weight: 600; }
    .ep.done .thumb img { opacity: .4; filter: grayscale(.6); }
    .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 2px 0; }
    .num { font-size: 12px; font-weight: 600; color: var(--muted); }
    .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .ep.done .title { color: var(--muted); }
    .meta { font-size: 12px; color: var(--faint); }
    .up { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: rgba(201, 182, 242, .16); color: var(--accent); font-size: 11px; font-weight: 600; vertical-align: 1px; }
    .why { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tick { flex: none; width: 56px; display: grid; place-items: center; }
    .tick span { width: 28px; height: 28px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--ink); transition: background .2s, transform .1s; }
    .tick:active span { transform: scale(.9); }
    .tick svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .tick:hover span { background: #2b2337; }
    .ep.done .tick span { background: var(--accent); }
    .ep.done .tick svg { opacity: 1; }

    .foot { margin: 30px 4px 0; color: var(--faint); font-size: 13px; }
    .foot a { color: var(--muted); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .2); }
    .empty { max-width: 760px; margin: 60px auto; padding: 0 16px; color: var(--muted); }

    @media (max-width: 560px) {
      .poster { width: 84px; }
      .thumb { width: 112px; }
      .thumb.portrait { width: 60px; }
      .ep-link { gap: 11px; padding: 8px; }
      .title { font-size: 15px; }
      .tick { width: 48px; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="wrap">
      <a class="brand" href="/"><img src="/static/logo.png" alt="" />sinehan</a>
      <div class="head">
        <img class="poster" id="poster" alt="" hidden />
        <div>
          <p class="kicker">Watch guide</p>
          <h1 id="show"></h1>
          <p class="topic" id="topic" hidden></p>
          <p class="show-meta" id="showMeta" hidden></p>
        </div>
      </div>
      <div class="progress"><span id="count"></span><span class="sync" id="sync">Saved on this device</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <main id="main" hidden>
    <div class="wrap">
      <div id="list"></div>
      <p class="foot">Tap an episode to read about it. Tick it off when you've watched it. Made with <a href="/">Sinehan</a>, a movie theater for two.</p>
    </div>
  </main>

  <p class="empty" id="empty" hidden>This link doesn't have a watch guide in it. Ask for a new link, or make one in the Sinehan sidebar.</p>

  <script>
    // The guide travels in the link itself (after #, which browsers never send to the server). Ticks are
    // kept on this device, and if the link came from a party, they sync live with it through the relay.
    // Pictures and air dates are looked up from TVmaze (series) or Wikipedia (films) by this browser.
    (async () => {
      const $ = (id) => document.getElementById(id);
      const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';
      const norm = (s) => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
      const flat = (s) => norm(s).replace(/^the /, '').replace(/ /g, '');

      async function decode(text) {
        const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return JSON.parse(await new Response(stream).text());
      }
      let g;
      try {
        g = await decode(new URLSearchParams(location.hash.slice(1)).get('g') || '');
        if (!g?.s || !Array.isArray(g.e)) throw new Error('no guide');
      } catch {
        $('empty').hidden = false;
        return;
      }

      const KEY = /^(S\d+E\d+|T:[\p{L}\p{N} ]{1,100})$/u;
      const episodes = g.e.filter((e) => Array.isArray(e) && KEY.test(e[0])).slice(0, 200)
        .map(([key, title, reason, kind]) => ({ key, title: String(title || '').slice(0, 120), reason: String(reason || '').slice(0, 160), kind: String(kind || '').slice(0, 20) }));
      const id = String(g.id || `${g.s}|${g.t || ''}`).slice(0, 200);
      let wiki = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.fandom\.com$/.test(g.f || '') ? g.f : '';
      const info = new Map(); // key -> { img, portrait, meta, url }

      // Ticks: what the link carried, then this device's own, then live ones (newest wins).
      const store = `sinehan-guide:${id}`;
      let done = {};
      for (const k of Array.isArray(g.d) ? g.d : []) done[k] = { v: true, at: 0 };
      try { Object.assign(done, JSON.parse(localStorage.getItem(store) || '{}')); } catch {}
      const save = () => { try { localStorage.setItem(store, JSON.stringify(done)); } catch {} };

      document.title = `${g.s}${g.t ? ` · ${g.t}` : ''} · watch guide`;
      $('show').textContent = g.s;
      if (g.t) {
        $('topic').textContent = g.t;
        $('topic').hidden = false;
      }
      $('hero').hidden = $('main').hidden = false;

      // Where an episode links: its page on the show's fan wiki, else what TVmaze or Wikipedia has.
      const linkFor = (e) => (wiki ? `https://${wiki}/wiki/Special:Search?search=${encodeURIComponent(e.title || e.key)}&go=Go` : info.get(e.key)?.url || '');

      let firstRender = true;
      function render() {
        const isDone = (k) => !!done[k]?.v;
        const watched = episodes.filter((e) => isDone(e.key)).length;
        const noun = episodes.some((e) => e.kind) ? 'title' : 'episode';
        $('count').innerHTML = `<b>${watched}</b> of ${episodes.length} ${noun}${episodes.length === 1 ? '' : 's'} watched`;
        $('bar').style.width = `${episodes.length ? (watched / episodes.length) * 100 : 0}%`;
        const next = episodes.find((e) => !isDone(e.key));
        const out = [];
        let section = null;
        let nextRow = null;
        for (const e of episodes) {
          const sec = e.kind || `Season ${e.key.match(/^S(\d+)/)?.[1] || ''}`;
          if (sec !== section) {
            section = sec;
            const h = document.createElement('div');
            h.className = 'section';
            h.textContent = sec;
            out.push(h);
          }
          const extra = info.get(e.key) || {};
          const row = document.createElement('div');
          row.className = `ep${isDone(e.key) ? ' done' : ''}${e === next ? ' next' : ''}`;

          const link = document.createElement('a');
          link.className = 'ep-link';
          const href = linkFor(e);
          if (href) {
            link.href = href;
            link.target = '_blank';
            link.rel = 'noopener';
          }
          const thumb = document.createElement('span');
          thumb.className = `thumb${extra.portrait || e.kind ? ' portrait' : ''}`;
          if (extra.img) {
            const img = document.createElement('img');
            img.src = extra.img;
            img.alt = '';
            img.loading = 'lazy';
            thumb.append(img);
          } else {
            const no = document.createElement('span');
            no.className = 'no';
            no.textContent = e.kind ? '' : e.key.replace(/^S(\d+)E(\d+)$/, '$1×$2');
            thumb.append(no);
          }
          const body = document.createElement('span');
          body.className = 'body';
          if (!e.kind) {
            const num = document.createElement('span');
            num.className = 'num';
            num.textContent = e.key.replace(/^S(\d+)E(\d+)$/, 'Season $1 · Episode $2');
            body.append(num);
          }
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = e.title || e.key;
          if (e === next) {
            const up = document.createElement('span');
            up.className = 'up';
            up.textContent = 'Up next';
            title.append(up);
          }
          body.append(title);
          if (extra.meta) {
            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = extra.meta;
            body.append(meta);
          }
          if (e.reason && !/^\d{4}$/.test(e.reason)) {
            const why = document.createElement('span');
            why.className = 'why';
            why.textContent = e.reason;
            body.append(why);
          }
          link.append(thumb, body);

          const tick = document.createElement('button');
          tick.className = 'tick';
          tick.setAttribute('aria-label', isDone(e.key) ? 'Mark as not watched' : 'Mark as watched');
          tick.setAttribute('aria-pressed', String(isDone(e.key)));
          tick.innerHTML = `<span>${CHECK}</span>`; // fixed markup
          tick.onclick = () => setTick(e.key, !isDone(e.key));
          row.append(link, tick);
          out.push(row);
          if (e === next) nextRow = row;
        }
        const y = window.scrollY;
        $('list').replaceChildren(...out);
        if (firstRender && nextRow && episodes.indexOf(next) > 2) nextRow.scrollIntoView({ block: 'center' });
        else window.scrollTo(0, y);
        firstRender = false;
      }

      // ---- Pictures and details ----
      const monthYear = (d) => (d ? new Date(`${d}T12:00:00`).toLocaleDateString([], { month: 'short', year: 'numeric' }) : '');
      async function seriesDetails() {
        try {
          const r = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(g.s)}&embed=episodes`);
          if (!r.ok) return;
          const show = await r.json();
          if (flat(show.name) !== flat(g.s)) return; // not sure it's the same show: no pictures rather than wrong ones
          $('show').textContent = officialName = show.name; // its official name ("911" -> "9-1-1")
          const art = (x) => String(x || '').replace(/^http:/, 'https:');
          if (show.image?.medium) {
            $('poster').src = art(show.image.medium);
            $('poster').hidden = false;
            $('backdrop').style.backgroundImage = `url("${art(show.image.original)}")`;
            $('backdrop').classList.add('on');
          }
          const eps = show._embedded?.episodes || [];
          const seasons = new Set(eps.map((e) => e.season)).size;
          $('showMeta').textContent = [show.premiered?.slice(0, 4), seasons && `${seasons} season${seasons === 1 ? '' : 's'}`, show.network?.name || show.webChannel?.name].filter(Boolean).join(' · ');
          $('showMeta').hidden = false;
          for (const e of eps) {
            info.set(`S${e.season}E${e.number}`, {
              img: art(e.image?.medium),
              meta: [monthYear(e.airdate), e.runtime && `${e.runtime} min`].filter(Boolean).join(' · '),
              url: e.url,
            });
          }
          render();
        } catch {}
      }
      async function filmDetails() {
        const list = episodes.filter((e) => e.kind).slice(0, 60);
        const one = async (e) => {
          try {
            const what = e.kind === 'Series' ? 'TV series' : e.kind === 'Films' ? 'film' : 'short film';
            const r = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(`${e.title} ${what}`)}&gsrlimit=1`
              + '&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=320&pilicense=any&format=json&formatversion=2&origin=*');
            const page = (await r.json())?.query?.pages?.[0];
            if (page) info.set(e.key, { img: page.thumbnail?.source || '', portrait: true, meta: e.reason && /^\d{4}$/.test(e.reason) ? e.reason : '', url: page.fullurl });
          } catch {}
        };
        const queue = [...list];
        await Promise.all(Array.from({ length: 4 }, async () => {
          while (queue.length) await one(queue.shift());
        }));
        const first = info.get(list[0]?.key)?.img;
        if (first) {
          $('backdrop').style.backgroundImage = `url("${first}")`;
          $('backdrop').classList.add('on');
        }
        render();
      }

      // Older links don't name the fan wiki: find it from the show's name ("9-1-1" -> 9-1-1.fandom.com).
      async function findWiki(names) {
        const slugs = [...new Set(names.filter(Boolean).flatMap((n) => {
          const flatName = norm(n).replace(/ /g, '');
          const dashed = norm(n).replace(/ /g, '-');
          return [flatName, flatName.replace(/^the/, ''), dashed, dashed.replace(/^the-/, '')];
        }))].filter((x) => x.length >= 3);
        for (const slug of slugs.slice(0, 6)) {
          try {
            const r = await fetch(`https://${slug}.fandom.com/api.php?action=query&meta=siteinfo&format=json&origin=*`);
            if (r.ok && (r.headers.get('content-type') || '').includes('json') && (await r.json())?.query?.general) return new URL(r.url).host;
          } catch {}
        }
        return '';
      }
      let officialName = '';
      async function linkToWiki() {
        if (wiki) return;
        wiki = await findWiki([g.s, officialName]);
        if (wiki) render();
      }

      // ---- Live ticks with the party ----
      let ws = null;
      function setTick(key, v) {
        const t = { v, at: Date.now() };
        done[key] = t;
        save();
        render();
        if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'guide-tick', id, key, v, at: t.at }));
      }
      function connect() {
        if (!g.r || !/^wss?:\/\//.test(g.w || '')) return;
        ws = new WebSocket(g.w);
        ws.onopen = () => {
          ws.send(JSON.stringify({ type: 'join', room: String(g.r).slice(0, 64), companion: true }));
          $('sync').textContent = 'Syncing with your party';
          $('sync').classList.add('live');
        };
        ws.onmessage = (m) => {
          let msg;
          try { msg = JSON.parse(m.data); } catch { return; }
          if (msg.type === 'guide-tick' && msg.id === id && KEY.test(msg.key || '')) {
            if (!done[msg.key] || msg.at >= done[msg.key].at) {
              done[msg.key] = { v: !!msg.v, at: Number(msg.at) || Date.now() };
              save();
              render();
            }
          } else if (msg.type === 'guide-sync' && msg.guide?.id === id) {
            for (const [k, t] of Object.entries(msg.guide.done || {})) {
              if (KEY.test(k) && t && (!done[k] || t.at > done[k].at)) done[k] = { v: !!t.v, at: t.at };
            }
            save();
            render();
          }
        };
        ws.onclose = () => {
          $('sync').textContent = 'Saved on this device';
          $('sync').classList.remove('live');
          setTimeout(connect, 4000);
        };
      }
      setInterval(() => ws?.readyState === 1 && ws.send(JSON.stringify({ type: 'ping' })), 20000);

      render();
      connect();
      if (episodes.some((e) => e.kind)) filmDetails().then(linkToWiki);
      else seriesDetails().then(linkToWiki);
    })();
  </script>
</body>
</html>
